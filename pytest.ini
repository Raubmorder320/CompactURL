[pytest]
minversion = 8.0

# Корень репозитория в sys.path, чтобы `import services.*` работал
# при запуске pytest из любой директории
pythonpath = .

testpaths = services/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra             — краткая сводка по skip/xfail/fail в конце
# --strict-markers — опечатка в имени маркера = ошибка, а не тихий пропуск
# --ignore        — test_sharding.py это интеграционный скрипт, требующий
#                   запущенный docker-compose; в юнит-прогон он не входит
addopts =
    -ra
    --strict-markers
    --ignore=services/tests/test_sharding.py

# pytest-asyncio: async-тесты помечаются явно через @pytest.mark.asyncio
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

cache_dir = .pytest_cache
