name: CI
on: [push, workflow_dispatch]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: list files
        run: ls -la
      - name: lint
        run: pip install flake8 && flake8 services --ignore=E501 
      - name: unit tests
        run: pip install -r requirements.txt && pytest services/tests/test_units_local.py --maxfail=1 --disable-warnings -q