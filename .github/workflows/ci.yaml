name: CI
on: [push, workflow_dispatch]

jobs:
  hello:
    runs-on: ubuntu-latest
    if: github.ref_name == 'ci/github-actions'


    steps:
      - name: checkout
        uses: actions/checkout@v3
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: list files
        run: ls -la
      - name: lint
        run: pip install flake8 && flake8 . 